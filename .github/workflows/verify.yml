name: Verify Health MVP
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            bgssai-health-admin/bgssai-health-admin-react/package-lock.json
            bgssai-health-user/bgssai-health-user-react/package-lock.json
      - name: Build admin UI
        working-directory: bgssai-health-admin/bgssai-health-admin-react
        run: |
          npm ci
          npm run build:deploy
      - name: Build introduction UI
        working-directory: bgssai-health-user/bgssai-health-user-react
        run: |
          npm ci
          npm run build:deploy
      - name: Verify Java modules and packaged resources
        run: mvn -B verify
