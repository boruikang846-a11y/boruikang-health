# HEALTH-MVP-1: literal profile configuration, no placeholder expansion.
server.address=127.0.0.1
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.url=jdbc:h2:mem:healthtest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.druid.initial-size=1
spring.datasource.druid.max-active=10
spring.datasource.druid.min-idle=1
spring.datasource.druid.max-wait=10000
spring.datasource.druid.validation-query=SELECT 1
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:db/DDL-local.sql
spring.sql.init.data-locations[0]=classpath:db/DML-local.sql
spring.sql.init.data-locations[1]=classpath:db/dev/DML-local.sql
jwt.secret=7yVJm4x-4sYh39rmNEzyYOl6uPqo-MUGUVHQnLurSIe9uH1R90ZowFrWP9oxfoBa
jwt.expiration-ms=28800000
health.user-url=http://localhost:3002
bgssai.cors.allowed-origins[0]=http://localhost:3001
bgssai.cors.allowed-origins[1]=http://localhost:3002
logging.config=classpath:log/logback-spring_stdout.xml
logging.applog.path=./logs

