spring.application.name=boruikang-health-user
spring.profiles.active=local
server.port=8080
health.portal=user
health.hospital-id=1
server.compression.enabled=true
server.error.include-message=never
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
mybatis.mapper-locations=classpath*:mybatis/mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
pagehelper.helper-dialect=mysql
pagehelper.reasonable=false
boruikang.health.cache-ttl-ms=2000
boruikang.health.probe-timeout-ms=2000
boruikang.health.db-validation-timeout-seconds=2
boruikang.health.pool-active-threshold-percent=90
boruikang.health.heap-used-threshold-percent=90
boruikang.health.disk-free-threshold-mb=512

health.hospital.mode=DISABLED
health.wechat.mock-allowed=false
