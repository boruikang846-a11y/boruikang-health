# Install after the certificate and both loopback services are ready; nginx -t before reload.
server {
    listen 80;
    server_name dev.admin.bgssai-health.com dev.user.bgssai-health.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dev.admin.bgssai-health.com;
    ssl_certificate /etc/nginx/ssl/bgssai-health/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/bgssai-health/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.2:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name dev.user.bgssai-health.com;
    ssl_certificate /etc/nginx/ssl/bgssai-health/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/bgssai-health/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.3:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
