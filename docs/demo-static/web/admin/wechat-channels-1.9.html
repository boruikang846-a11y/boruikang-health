<style>*{box-sizing:border-box}body{margin:0;font:14px system-ui,"Microsoft YaHei",sans-serif;color:#23374b;background:#f4f7fb}header{height:64px;background:#fff;border-bottom:1px solid #e5ebf2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 28px}aside{position:fixed;top:64px;bottom:0;width:210px;background:#fff;padding:18px 12px;overflow:auto}aside button{display:block;width:100%;text-align:left;background:#fff;color:#5c6d80;border:0;border-radius:7px;padding:9px 13px;margin:4px 0;font:inherit;cursor:pointer}aside button.active{background:#e9f1ff;color:#2364db}main{margin-left:210px;padding:28px;max-width:1400px}h1{font-size:24px;margin:0 0 6px}h2{font-size:16px;margin:0 0 12px}p{color:#6d7e91;line-height:1.7}.card,.block{background:#fff;border:1px solid #e4eaf1;border-radius:10px;padding:20px;margin-bottom:18px}.card{overflow-x:auto}.block{padding:16px;margin:14px 0 0}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 8px;border-bottom:1px solid #edf1f6;text-align:left;vertical-align:top}th{background:#f7f9fc;color:#7d8a9e;font-weight:500}.tag{display:inline-block;padding:2px 8px;border-radius:4px;background:#edf3fb;color:#2665b7;font-size:12px;margin-right:4px}.tag.green{background:#e3f6ef;color:#1f7a5d}.tag.gold{background:#fff4d6;color:#9a6a00}.tag.red{background:#fde8e5;color:#b8432f}.num{display:inline-block;min-width:20px;padding:1px 6px;border-radius:10px;background:#d9482f;color:#fff;font-size:12px;text-align:center}.toolbar,.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar{margin-bottom:14px}.row{margin-top:10px}.between{justify-content:space-between;margin:0}.seg{display:inline-flex;background:#f0f3f7;border-radius:8px;padding:3px}.seg span{padding:5px 12px;border-radius:6px;cursor:pointer}.seg span.on{background:#fff;box-shadow:0 1px 3px #0002}textarea,input,select{font:inherit;padding:8px 10px;border:1px solid #d9e1ea;border-radius:7px;max-width:100%}textarea,.form input,.form select,dialog select,.block select{width:100%}textarea,.block select{display:block;margin-top:10px}input[type=checkbox]{width:auto}button.btn{font:inherit;padding:7px 14px;border-radius:7px;border:1px solid #d9e1ea;background:#fff;cursor:pointer}button.primary{background:#2364db;color:#fff;border-color:#2364db}button.danger{color:#c2412d;border-color:#f2c3bb}button:disabled{opacity:.5;cursor:default}.muted{color:#8290a3;font-size:12px}.err{color:#b8432f}.note{border-left:4px solid #dc9946;background:#fff8e9;padding:10px 14px;margin:0 0 18px;font-size:13px;line-height:1.7}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}.form label,dialog label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#65778c}.form b{font-size:14px;color:#23374b}.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,96vw);background:#fff;box-shadow:-8px 0 30px #0002;padding:24px;overflow:auto;display:none}.drawer.open{display:block}dialog{border:0;border-radius:12px;padding:24px;width:640px;max-width:95vw}dialog::backdrop{background:#0006}.msg{margin:12px 0;max-width:85%}.msg.out{margin-left:auto;text-align:right}.bub{display:inline-block;text-align:left;background:#f0f3f7;border-radius:10px;padding:8px 12px;white-space:pre-wrap;word-break:break-word;margin-bottom:4px}.out .bub{background:#e3efff}.ev{text-align:center;color:#8290a3;font-size:12px;margin:12px 0}.qr{width:116px;height:116px;border:2px dashed #9aa9bb;background:#f7f9fc;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:#65778c}.report{background:#f7f9fc;border-radius:8px;padding:14px;margin:10px 0}.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs span{padding:6px 12px;border-radius:6px;background:#f0f3f7}.tabs span.on{background:#2364db;color:#fff}#toast{position:fixed;z-index:5;left:50%;bottom:24px;transform:translateX(-50%);background:#123e52;color:#fff;padding:10px 16px;border-radius:8px;max-width:90vw;display:none;line-height:1.6}@media(max-wi <body><header><b>BGSSAI Health · 1.9 企业微信与公众号沟通原型</b><span class="muted">当前角色 <select onchange="setWho(this.value)"><option value="M">运营主管</option><option value="O">运营人员（护士相同）</option><option value="D">责任医生</option><option value="P">平台管理员</option></select> · <a href="../../../feature/wechat-channels-1.9.html">业务流程图</a> · <a href="index.html">管理端原型</a> · <a href="PAGE-FLOW.html">页面契约</a></span></header>
<aside id="nav"></aside>
<main><div class="note">HEALTH 1.9 页面流程演示，数据全部虚构。本页不调用微信接口、不连接后端；保存、发送、测试连接的结果只存在于本页面，刷新即还原。标“演示”“模拟”的内容都不代表已接通微信。</div><div id="page"></div></main>
<div class="drawer" id="drawer"></div><dialog id="dlg"></dialog><div id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CH={WE_COM:'企业微信',WECHAT_OFFICIAL:'公众号'},W='WE_COM',O='WECHAT_OFFICIAL';
const ST={SENDING:['发送中','gold'],SENT:['已发出','green'],PENDING_CONFIRM:['待成员确认','gold'],FAILED:['失败','red'],RECEIVED:['待处理','red'],HANDLED:['已处理','']};
const KIND={TEXT:'文字',TEMPLATE:'模板消息',APPROVED_ADVICE:'已审核正文',WELCOME:'欢迎语'};
const ROLE={M:'运营主管',O:'运营人员',D:'责任医生',P:'平台管理员'},NOAPI='本页面没有调用微信接口。',A='演示运营专员甲';
const cfg={
 WE_COM:{name:'医院企业微信',idLabel:'企业 ID',secLabel:'客户联系 Secret',app_id:'ww0000000000000000',secret:true,token:true,aes:true,enabled:true,mode:'LIVE',verified:'',error:'',path:'/bgssai/open/wecom/callback/1',desc:'同步好友关系与加删事件；发消息走群发任务，成员在企业微信确认后才发出。未开通会话存档，系统读不到聊天内容。'},
 WECHAT_OFFICIAL:{name:'医院公众号',idLabel:'AppID',secLabel:'AppSecret',app_id:'wx0000000000000000',secret:true,token:true,aes:false,enabled:true,mode:'MOCK',verified:'',error:'',path:'/bgssai/open/wechat/callback/1',desc:'接收关注、取消关注和患者文字来信；发客服文字消息和模板消息。'}};
const patients={1001:{name:'演示患者一',mask:'演*一',phone:'000****0001',mine:true},1002:{name:'演示患者二',mask:'演*二',phone:'000****0002',mine:true},1003:{name:'演示患者三',mask:'演*三',phone:'000****0003',mine:false}};
const E=(time,text,mock)=>({kind:'EVENT',time,text,mock}),M=(dir,kind,time,text,st,x)=>({dir,kind,time,text,st,by:A,...x});
const contacts=[
 {id:1,ch:O,ext:'openid-demo-001',nick:'',staff:'',src:'演示门诊渠道 ch1',active:true,h:2,pid:1001,mock:1,msgs:[
  E('10-01 09:10','关注公众号（扫渠道二维码 ch1）',1),
  M('OUT','WELCOME','10-01 09:10','欢迎关注，这里是健康管理团队（虚构欢迎语）。','SENT',{by:'系统',mock:1}),
  M('OUT','TEMPLATE','10-02 10:00','thing1=复诊提醒\ntime2=2026-10-08','SENT',{mock:1}),
  M('IN','TEXT','10-02 10:20','好的，收到。','HANDLED',{mock:1}),
  M('OUT','TEXT','10-03 16:00','您好，复诊前有疑问可以在这里留言。','FAILED',{mock:1,err:'45047 out of response count limit'}),
  E('10-04 08:03','收到一张图片（只记录类型，不保存内容）',1),
  M('IN','TEXT','10-04 08:05','请问复诊要带什么？','RECEIVED',{mock:1})]},
 {id:2,ch:W,ext:'wm-demo-001',nick:'虚构昵称甲',staff:A,src:'演示门诊渠道 ch1',active:true,pid:1002,msgs:[
  E('09-30 14:00','添加企业微信好友（添加成员：'+A+'，渠道活码 ch1）'),
  M('OUT','TEXT','10-04 09:00','您好，这里是健康管理团队，复诊提醒会通过企业微信通知您。','PENDING_CONFIRM')]},
 {id:3,ch:O,ext:'openid-demo-002',nick:'',staff:'',src:'演示社区活动渠道 ch2',active:true,h:86,pid:0,mock:1,msgs:[
  E('09-28 11:00','关注公众号（扫渠道二维码 ch2）',1),
  M('IN','TEXT','09-30 20:00','你好，我是参加社区活动的。','HANDLED',{mock:1})]},
 {id:4,ch:W,ext:'wm-demo-002',nick:'虚构昵称乙',staff:A,src:'演示门诊渠道 ch1',active:true,pid:0,msgs:[E('10-03 15:20','添加企业微信好友（添加成员：'+A+'，渠道活码 ch1）')]},
 {id:5,ch:O,ext:'openid-demo-003',nick:'',staff:'',src:'演示门诊渠道 ch1',active:false,h:999,pid:1003,mock:1,msgs:[E('09-20 10:00','关注公众号',1),E('10-02 18:00','取消关注：标为已失联，记录保留',1)]}];
const tasks=[{id:3001,pid:1001,title:'随访 · D7 随访',ok:true,text:'您好，这里是健康管理团队。请按原医嘱继续执行；10 月 8 日复诊时请携带出院小结，如有不适请及时就诊。'},{id:3002,pid:1001,title:'咨询 · 复诊准备',ok:false,text:''}];
const accounts=[{id:2,name:'演示责任医生',login:'doctor',r:'医生',wecom:''},{id:3,name:A,login:'operator_a',r:'运营人员',wecom:'wecom-demo-a'},{id:4,name:'演示运营专员乙',login:'operator_b',r:'运营人员',wecom:''},{id:5,name:'演示护士',login:'nurse',r:'护士',wecom:''}];
const chans=[{id:1,name:'演示门诊渠道',acc:3,qr:{}},{id:2,name:'演示社区活动渠道',acc:4,qr:{}}];
const demo={WE_COM:'ok',WECHAT_OFFICIAL:'ok',send:'ok'},filt={ch:'',bound:'',pending:false};
let who='M',page='settings',cur=0,kind='TEXT',selTask=0,busy=false,taskSeq=3002,timer;

const hm=()=>'今天 '+new Date().toTimeString().slice(0,5),one=(a,f)=>a.filter(f)[0],byId=id=>one(contacts,c=>c.id===id),acc=id=>one(accounts,a=>a.id===id);
const can=r=>r.includes(who),usable=p=>cfg[p].enabled&&cfg[p].app_id&&cfg[p].secret,isMock=p=>cfg[p].mode==='MOCK',off=p=>CH[p]+'通道未配置或未启用，不调用接口。';
const pend=c=>c.msgs.filter(m=>m.st==='RECEIVED').length,handle=c=>c.msgs.forEach(m=>{if(m.st==='RECEIVED')m.st='HANDLED'});
const sees=c=>who==='M'||(who==='O'&&(!c.pid||patients[c.pid].mine))||(who==='D'&&c.pid===1001);
const total=()=>contacts.filter(sees).reduce((n,c)=>n+pend(c),0);
const opt=(v,t,now)=>`<option value="${v}"${v===now?' selected':''}>${t}</option>`;
const tg=(t,c='')=>`<span class="tag ${c}">${t}</span>`,btn=(t,fn,c='')=>`<button class="btn ${c}" onclick="${fn}">${t}</button>`,mu=t=>`<p class="muted">${t}</p>`;
const tags=m=>tg(m.mock?'模拟':'演示','gold');
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(timer);timer=setTimeout(()=>e.style.display='none',6000)}
function dlg(html,act,ok){const d=$('#dlg');d.innerHTML=html+`<p id="err" class="err" role="alert"></p><div class="row">${btn('取消','dlgClose()')}${btn(ok||'保存',act,'primary')}</div>`;d.showModal()}
function dlgClose(){$('#dlg').close()}
function go(k){page=k;render()}
function setWho(v){who=v;if(v==='O'&&!filt.bound)filt.bound='1';render()}
function setDemo(k,v){demo[k]=v}
function setF(k,v){filt[k]=v;render()}
function render(){const ps=PAGES.filter(p=>p[2].includes(who)),n=total();if(!ps.some(p=>p[0]===page))page=ps[0][0];
 $('#nav').innerHTML=ps.map(([k,t])=>`<button class="${k===page?'active':''}" onclick="go('${k}')">${t}${k==='wechat'&&n?` <span class="num">${n}</span>`:''}</button>`).join('');
 $('#page').innerHTML=one(ps,p=>p[0]===page)[3]();drawChat()}

/* 外部接入 */
function stOf(c){return c.mode==='MOCK'?['模拟通道','gold']:!(c.app_id&&c.secret)?['未配置','']:c.error?['连接失败','red']:c.verified?['已接通','green']:['已配置 · 未验证','gold']}
function vSettings(){const edit=can('MP');return `<h1>运营设置 · 外部接入</h1><p>运营主管或平台管理员填写凭证、测试连接，再把回调地址配到微信后台。密钥只写不读、不回显；没有接通的通道不会显示成已接通。</p>`+[W,O].map(p=>{const c=cfg[p],res=isMock(p)?'模拟通道，不取真实凭证':c.error?`<span class="err">${c.error}</span>（演示结果）`:c.verified?c.verified+' 取凭证成功（演示结果）':'未测试';
 return `<div class="card"><div class="row between"><h2>${c.name}</h2><span>${tg(...stOf(c))}${c.error||c.verified?tg('演示结果','gold'):''}${tg(c.enabled?'已启用':'未启用')}</span></div><p>${c.desc}</p><div class="form"><label>${c.idLabel}<b>${esc(c.app_id)||'未填写'}</b></label><label>${c.secLabel}<b>${c.secret?'已保存，不回显':'未填写'}</b></label><label>回调 Token / EncodingAESKey<b>${c.token?'已保存':'未填写'} / ${c.aes?'已保存':'未填写'}</b></label><label>测试连接<b>${res}</b></label></div>${mu('回调地址路径（加上本系统域名后配到微信后台，按医院区分）')}<div class="toolbar"><input id="path-${p}" readonly size="34" value="${c.path}">${btn('复制',`copyPath('${p}')`)}</div><div class="toolbar" style="margin:0">${edit?btn('配置',`cfgOpen('${p}')`,'primary')+btn('测试连接',`verify('${p}')`)+`<select onchange="setDemo('${p}',this.value)">${opt('ok','演示：微信返回成功',demo[p])}${opt('fail','演示：微信返回 40013',demo[p])}</select>`+btn('演示用：清空配置',`resetCfg('${p}')`):'<span class="muted">当前角色只读，不能保存配置或测试连接。</span>'}</div></div>`}).join('')+(edit?mu('“演示：微信返回…”和“清空配置”只是演示控件，实际页面没有。'):'')}
function cfgOpen(p){const c=cfg[p],w=p===W,pw=(id,t)=>`<label>${t}<input id="f-${id}" type="password" autocomplete="off" placeholder="已保存则留空保留原值"></label>`;
 dlg(`<h2>配置${c.name}</h2><div class="form"><label>${c.idLabel}<input id="f-id" value="${esc(c.app_id)}" placeholder="${w?'ww':'wx'}0000000000000000"></label>${pw('sec',c.secLabel)}${pw('tok','回调 Token（3–32 位字母数字）')}${pw('aes','EncodingAESKey（43 位'+(w?'':'，明文模式可不填')+'）')}<label>通道模式<select id="f-mode">${opt('LIVE','正式：调用微信接口',c.mode)}${opt('MOCK','模拟通道：仅 local、test、dev，prod 不允许',c.mode)}</select></label><label>启用<span><input id="f-on" type="checkbox"${c.enabled?' checked':''}> 启用后才接收回调和发送</span></label></div>${mu(`只填虚构内容。密钥不回显、不进日志；修改${c.idLabel}、Secret 或通道模式后回到“未验证”。保存不代表已接通。`)}`,`cfgSave('${p}')`)}
function cfgSave(p){const c=cfg[p],v=k=>$('#f-'+k).value.trim(),id=v('id'),sec=v('sec'),tok=v('tok'),aes=v('aes'),mode=v('mode'),on=$('#f-on').checked;
 const e=tok&&!/^[A-Za-z0-9]{3,32}$/.test(tok)?'回调 Token 须为 3–32 位字母数字':aes&&aes.length!==43?'EncodingAESKey 须为 43 位':on&&!(id&&(sec||c.secret))?'启用前请填齐'+c.idLabel+'和'+c.secLabel:on&&p===W&&!((tok||c.token)&&(aes||c.aes))?'企业微信回调必须加密，启用前请填回调 Token 和 EncodingAESKey':'';
 if(e)return $('#err').textContent=e;
 if(id!==c.app_id||sec||mode!==c.mode){c.verified='';c.error=''}
 Object.assign(c,{app_id:id,secret:c.secret||!!sec,token:c.token||!!tok,aes:c.aes||!!aes,mode,enabled:on});dlgClose();render();toast('演示：配置只保存在本页面。当前状态：'+stOf(c)[0]+'。')}
function verify(p){const c=cfg[p],ok=demo[p]==='ok';if(isMock(p))return toast('模拟通道不取真实凭证，不代表已接通。');if(!(c.app_id&&c.secret))return toast('请先保存'+c.idLabel+'和'+c.secLabel+'。');
 c.verified=ok?hm():'';c.error=ok?'':'40013 invalid appid';render();toast('演示结果：'+NOAPI+'实际页面会用已保存凭证真实取一次 access_token。')}
function resetCfg(p){Object.assign(cfg[p],{app_id:'',secret:false,token:false,aes:false,enabled:false,mode:'LIVE',verified:'',error:''});render()}
function copyPath(p){let ok=false;$('#path-'+p).select();try{ok=document.execCommand('copy')}catch(e){}toast(ok?'已复制回调路径。':'已选中回调路径，请按 Ctrl+C 复制。')}

/* 微信沟通 */
function row(c){const l=c.msgs[c.msgs.length-1],n=pend(c),p=patients[c.pid],act=can('MO');
 return `<tr><td><b>${esc(c.nick)||'（公众号拿不到昵称）'}</b><div class="muted">${c.ext}</div></td><td>${tg(CH[c.ch])}${tags(c)}<div class="muted">来源 ${c.src}${c.staff?' · 添加成员 '+c.staff:''}</div></td><td>${c.active?tg('有效','green'):tg('已失联','red')}</td><td>${p?p.mask+' #'+c.pid:tg('待绑定','gold')}</td><td>${l?esc(l.text.slice(0,18)):'—'}<div class="muted">${l?l.time:''}</div></td><td>${n?`<span class="num">${n}</span>`:'—'}</td><td>${btn(act?'打开会话':'查看会话',`chat(${c.id})`)} ${!act?'':p?btn('解绑',`unbindOpen(${c.id})`,'danger'):btn('绑定患者',`bindOpen(${c.id})`)}</td></tr>`}
const listTable=l=>`<table><tr><th>联系人</th><th>通道 / 来源</th><th>关系</th><th>患者</th><th>最近消息</th><th>待处理</th><th>操作</th></tr>${l.map(row).join('')||'<tr><td colspan="7">暂无匹配的联系人</td></tr>'}</table>`;
function vWechat(){const m=who==='M',n=total(),seg=(v,t)=>`<span class="${filt.bound===v?'on':''}" onclick="setF('bound','${v}')">${t}</span>`;
 const l=contacts.filter(c=>sees(c)&&(!filt.ch||c.ch===filt.ch)&&(!filt.bound||(filt.bound==='1')===!!c.pid)&&(!filt.pending||pend(c)));
 return `<h1>微信沟通${n?` <span class="num">${n}</span> <span class="muted">条来信待处理</span>`:''}</h1><p>加好友、关注后生成微信联系人；核实身份后绑定患者档案，再发消息。${m?'运营主管看全院。':'运营人员、护士只看待绑定和自己负责患者的联系人。'}</p>${[W,O].filter(p=>!usable(p)).map(p=>`<div class="note">${off(p)}这个通道的联系人暂时不能发送。</div>`).join('')}<div class="card"><div class="toolbar"><select onchange="setF('ch',this.value)">${opt('','全部通道',filt.ch)}${opt(W,CH[W],filt.ch)}${opt(O,CH[O],filt.ch)}</select><span class="seg">${m?seg('','全部'):''}${seg('1',m?'已绑定':'已绑定（我负责的患者）')}${seg('0','待绑定')}</span><label><input type="checkbox"${filt.pending?' checked':''} onchange="setF('pending',this.checked)"> 仅看待处理</label>${m?btn('同步联系人','syncOpen()'):''}</div>${listTable(l)}</div>`}
function chat(id){cur=id;kind='TEXT';selTask=0;render()}
function chatClose(){cur=0;render()}
function setKind(k){kind=k;render()}
function pickTask(v){selTask=+v;render()}
function block(c){const w=c.ch===W,adv=kind==='APPROVED_ADVICE',tpl=kind==='TEMPLATE';return !c.active?'联系人已失联（删除好友或取消关注），不调用接口。':!usable(c.ch)?off(c.ch):tpl&&w?'模板消息仅公众号可用。':adv&&!c.pid?'联系人还没有绑定患者，不能发送已审核正文。':adv&&!tasks.some(t=>t.pid===c.pid&&t.ok)?'这位患者没有责任医生审核通过的任务。':!tpl&&!w&&c.h>48?'患者最后互动已超过 48 小时，公众号文字发不出去，请改发模板消息。':!tpl&&w&&!c.staff?'联系人没有添加成员，不能创建群发任务。':''}
function bubble(c,m,i,act){if(m.kind==='EVENT')return `<div class="ev">${m.time} · ${esc(m.text)} ${tags(m)}</div>`;
 const out=m.dir==='OUT',b=!act?'':m.st==='PENDING_CONFIRM'?btn('刷新发送结果',`refreshMsg(${i})`):out||!c.pid?'':m.consult?tg('已转咨询任务 #'+m.consult):btn('转咨询任务',`consult(${i})`);
 return `<div class="msg${out?' out':''}"><div class="bub">${m.kind==='TEXT'?'':tg(KIND[m.kind]+(m.task?' · 任务 #'+m.task:''))+'\n'}${esc(m.text)}</div><div class="muted">${m.time} · ${out?esc(m.by):'患者来信'} ${tg(...ST[m.st])}${tags(m)}${m.err?`<span class="err">${esc(m.err)}</span> `:''}${b}</div></div>`}
function sendBox(c){const w=c.ch===W,why=block(c),t=one(tasks,x=>x.id===selTask&&x.ok&&x.pid===c.pid);
 const body=kind==='TEXT'?`<textarea id="txt" rows="3" placeholder="例如：您好，这里是健康管理团队。"></textarea>`+mu(w?'企业微信：创建群发任务，成员在企业微信确认后发出；确认前为“待成员确认”，可刷新查看。':`公众号：走客服消息，要求患者 48 小时内有过互动（${c.h<900?'最后互动 '+c.h+' 小时前':'没有互动记录'}），否则请改发模板消息。`)
 :kind==='TEMPLATE'?`<select><option>复诊提醒 MP_REVISIT（已登记微信模板 ID）</option></select><textarea id="txt" rows="3">thing1=复诊提醒\ntime2=2026-10-08</textarea>`+mu('仅公众号。每行按“字段=内容”填写，字段名用字母、数字、下划线，至少一行；发送前可改内容。')
 :`<select onchange="pickTask(this.value)"><option value="0">选择任务</option>${tasks.filter(x=>c.pid&&x.pid===c.pid).map(x=>`<option value="${x.id}"${x.ok?'':' disabled'}${x.id===selTask?' selected':''}>#${x.id} ${x.title} · ${x.ok?'已审核':'待医生审核，不能发送'}</option>`).join('')}</select><textarea rows="4" readonly placeholder="选择已审核的任务后显示正文">${t?esc(t.text):''}</textarea>`+mu('正文取自任务里责任医生本人审核通过的内容，页面不能改。发送不改变任务状态，联系结果仍在任务里登记，联系方式选“微信”。');
 return `<div class="block"><h2>发送</h2><span class="seg">${['TEXT','TEMPLATE','APPROVED_ADVICE'].map(k=>`<span class="${k===kind?'on':''}" onclick="setKind('${k}')">${KIND[k]}</span>`).join('')}</span>${body}${why?`<p class="err">${why}</p>`:''}<div class="row"><select onchange="setDemo('send',this.value)">${opt('ok','演示：微信受理',demo.send)}${opt('fail','演示：微信返回错误',demo.send)}</select><button class="btn primary" onclick="doSend()"${why||busy?' disabled':''}>${w?'创建群发任务':'发送'}</button></div>${mu('发送成功只表示微信接口受理，不代表患者已读，不能代替联系结果登记。')}</div>`}
function drawChat(){const d=$('#drawer'),c=byId(cur);if(!c||!sees(c)){cur=0;d.classList.remove('open');return}
 const act=can('MO'),p=patients[c.pid],w=c.ch===W,n=pend(c);
 d.innerHTML=`<div class="row between"><b>${CH[c.ch]}会话 · ${esc(c.nick)||c.ext}</b>${btn('关闭','chatClose()')}</div>${mu(`演示会话，未连接微信。${c.ext} · ${p?'已绑定 '+p.mask+' #'+c.pid:'待绑定'} · ${c.active?'关系有效':'已失联，记录保留'}${isMock(c.ch)?' · 模拟通道':''}`)}${w?'<div class="note">未开通会话存档：系统读不到成员与客户在企业微信里的聊天内容，这里只有好友关系事件和本系统发出的消息。</div>':''}<div>${c.msgs.map((m,i)=>bubble(c,m,i,act)).join('')||'<div class="ev">暂无记录</div>'}</div>${act?`<div class="row">${n?btn(`标记已处理（${n}）`,'markHandled()'):''}${who==='M'&&!w&&isMock(c.ch)&&c.active?btn('模拟一条患者来信','mockIn()'):''}</div>`+sendBox(c):mu('责任医生只读查看自己负责患者的微信沟通记录，不能发送、绑定或处理。')}`;d.classList.add('open')}
function doSend(){const c=byId(cur),w=c.ch===W,fail=demo.send==='fail';if(busy||block(c))return;let text=($('#txt')||{value:''}).value.trim(),tid=0;
 if(kind==='APPROVED_ADVICE'){const t=one(tasks,x=>x.id===selTask&&x.ok&&x.pid===c.pid);if(!t)return toast('请先选择责任医生审核通过的任务。');text=t.text;tid=t.id}
 else if(!text)return toast('请填写内容。');
 if(kind==='TEMPLATE'){const ls=text.split('\n').map(s=>s.trim()).filter(Boolean);if(!ls.every(s=>/^[A-Za-z0-9_]{1,32}=.+$/.test(s)))return toast('模板内容每行按“字段=内容”填写，字段名用字母、数字、下划线。');text=ls.join('\n')}
 const m=M('OUT',kind,hm(),text,'SENDING',{by:ROLE[who],mock:isMock(c.ch),task:tid});c.msgs.push(m);busy=true;render();
 setTimeout(()=>{busy=false;if(fail){m.st='FAILED';m.err=w?'演示错误：84061 not external contact':'演示错误：40003 invalid openid'}else{m.st=w?'PENDING_CONFIRM':'SENT';handle(c)}
  render();toast('演示结果：'+(fail?'微信返回错误，记为“失败”并保存错误码，不显示成功。':w?'已创建群发任务，等成员在企业微信确认。'+NOAPI:'接口受理，记为“已发出”，待处理来信同时标为已处理。'+NOAPI))},900)}
function markHandled(){handle(byId(cur));render()}
function consult(i){const c=byId(cur),m=c.msgs[i];if(m.consult||!c.pid)return;m.consult=++taskSeq;tasks.push({id:taskSeq,pid:c.pid,title:'咨询 · 微信来信',ok:false,text:''});render();toast(`演示：已转成咨询任务 #${taskSeq}，来信原文作为患者原始咨询，后续沿用起草、责任医生审核、联系流程。`)}
function refreshMsg(i){const m=byId(cur).msgs[i];m.n=(m.n||0)+1;if(m.n<2)return toast('演示结果：成员还没有确认，保持“待成员确认”。再点一次演示成员已确认。');m.st='SENT';render();toast('演示结果：成员已确认，改为“已发出”。')}
function mockIn(){const c=byId(cur);c.msgs.push(M('IN','TEXT',hm(),'（模拟来信）请问复诊当天需要空腹吗？','RECEIVED',{mock:1}));c.h=0;render()}
function bindOpen(id){dlg(`<h2>绑定患者</h2>${mu(`联系人 ${byId(id).ext}。核实身份后再绑定；系统不按手机号、昵称、UnionID 自动合并。一个联系人只能绑一位患者，一位患者可以有多个联系人。`)}<label>选择患者（只列出当前角色可见的患者）<select id="f-pid">${Object.keys(patients).filter(k=>who==='M'||patients[k].mine).map(k=>opt(k,`#${k} ${patients[k].name} · ${patients[k].phone}`)).join('')}</select></label>`,`bindSave(${id})`,'绑定')}
function bindSave(id){const c=byId(id);c.pid=+$('#f-pid').value;dlgClose();render();toast('演示：已绑定 '+patients[c.pid].mask+'，并写入患者留痕。')}
function unbindOpen(id){dlg(`<h2>解绑</h2>${mu(`联系人 ${byId(id).ext}。解绑后回到待绑定，历史消息保留，并写入患者留痕。`)}<label>解绑原因（必填）<textarea id="f-why" rows="2" placeholder="例如：绑定错人"></textarea></label>`,`unbindSave(${id})`,'解绑')}
function unbindSave(id){const c=byId(id),why=$('#f-why').value.trim();if(!why)return $('#err').textContent='请填写解绑原因';c.pid=0;dlgClose();render();toast('演示：已解绑，联系人回到待绑定。')}
function syncOpen(){dlg(`<h2>同步联系人</h2><label>通道<select id="f-prov">${opt(W,CH[W])}${opt(O,CH[O])}</select></label>${mu('企业微信按已登记成员账号拉客户列表，公众号拉关注者列表。只新增和更新，不解绑；单次上限 1000 条，超出时提示。')}`,'syncRun()','同步')}
function syncRun(){const p=$('#f-prov').value,n=contacts.filter(c=>c.ch===p).length;dlgClose();toast(usable(p)?`${isMock(p)?'模拟':'演示'}结果：扫描 ${n} 条，新增 0 条，更新 ${n} 条，未超过 1000 条上限。${NOAPI}`:off(p))}

/* 渠道活码、成员账号、患者档案、任务抽屉 */
function vChannels(){const m=who==='M';return `<h1>渠道管理 · 渠道活码</h1><p>给渠道生成企业微信“联系我”二维码和公众号带参二维码，参数为渠道编号；患者扫码后，联系人自动带上来源渠道。</p><div class="card"><table><tr><th>渠道</th><th>负责人</th><th>企微活码</th><th>公众号二维码</th></tr>${chans.map(x=>{const a=acc(x.acc);return `<tr><td><b>${x.name}</b><div class="muted">渠道参数 ch${x.id}</div></td><td>${a.name}<div class="muted">企业微信成员账号：${esc(a.wecom)||'未登记'}</div></td>${[W,O].map(p=>`<td>${x.qr[p]?`<div class="qr">${x.qr[p]}占位图<br>不是二维码<br>不可扫码<br>参数 ch${x.id}</div>`:'<span class="muted">未生成</span>'}${m?`<div class="row">${btn(p===W?'生成企微活码':'生成公众号二维码',`genQr(${x.id},'${p}')`)}</div>`:''}</td>`).join('')}</tr>`}).join('')}</table>${mu(m?'企业微信活码要求渠道负责人已登记成员账号。':'只有运营主管可以生成活码。')}</div>`}
function genQr(id,p){const x=one(chans,c=>c.id===id),k=isMock(p)?'模拟':'演示';if(!usable(p))return toast(off(p));if(p===W&&!acc(x.acc).wecom)return toast('企业微信活码要求渠道负责人已登记成员账号，请先到“医护账号”登记。');x.qr[p]=k;render();toast(k+'结果：这里只画占位方块，没有向微信申请二维码。')}
function vAccounts(){return `<h1>医护账号 · 企业微信成员账号</h1><p>运营主管给工作账号登记企业微信成员账号，回调与同步据此显示“添加成员”是系统里的谁。同院内不能重复，留空保存表示清除。</p><div class="card"><table><tr><th>姓名</th><th>角色</th><th>企业微信成员账号</th><th></th></tr>${accounts.map(a=>`<tr><td><b>${a.name}</b><div class="muted">账号 ${a.login}</div></td><td>${tg(a.r)}</td><td><input id="wc-${a.id}" value="${esc(a.wecom)}" placeholder="未登记，例如 wecom-demo-b"></td><td>${btn('保存',`saveWecom(${a.id})`)}</td></tr>`).join('')}</table></div>`}
function saveWecom(id){const v=$('#wc-'+id).value.trim();if(v&&accounts.some(a=>a.id!==id&&a.wecom===v))return toast('这个成员账号已登记给其他账号，同院内不能重复。');acc(id).wecom=v;render();toast(v?'演示：已登记成员账号 '+v+'。':'演示：已清除成员账号。')}
function vPatient(){return `<h1>演示患者一 的健康档案</h1><p>责任医生：演示责任医生 · 负责人：${A}。档案新增“微信沟通”页签。${who==='D'?'责任医生只读查看，不能发送。':''}</p><div class="tabs"><span>时间轴</span><span>服务任务</span><span class="on">微信沟通</span><span>操作留痕</span></div><div class="card">${listTable(contacts.filter(c=>c.pid===1001))}${mu('时间轴合并微信收发；发送、绑定、解绑写入操作留痕，留痕只记消息类型、状态和编号，不记正文。')}</div>`}
function vTask(){return `<h1>任务抽屉 · 微信发送已审核正文</h1><p>随访或咨询任务“已审核”、且审核人是患者当前责任医生时，才能把审核通过的正文发给患者已绑定的微信联系人。</p>`+tasks.filter(t=>t.pid===1001).map(t=>`<div class="card">${tg(t.title.slice(0,2))}${tg(t.ok?'已审核':'待医生审核',t.ok?'green':'gold')}<h2 style="margin-top:10px">#${t.id} ${t.title} · 演*一</h2>${t.ok?mu('责任医生审核通过的正文（审核人：演示责任医生，是患者当前责任医生）')+`<div class="report">${esc(t.text)}</div>`:mu('正文还没有经责任医生审核通过，不能发送。')}<div class="row"><button class="btn primary"${t.ok?'':' disabled'} onclick="taskSend(${t.id})">微信发送已审核正文</button><span class="muted">发送不改变任务状态；联系结果仍在任务里登记，联系方式可选“微信”。</span></div></div>`).join('')}
function taskSend(id){const c=one(contacts,x=>x.pid===1001&&x.active);if(!c)return toast('这位患者没有已绑定且关系有效的微信联系人。');cur=c.id;kind='APPROVED_ADVICE';selTask=id;render()}
const PAGES=[['settings','外部接入','MOP',vSettings],['wechat','微信沟通','MO',vWechat],['channels','渠道管理 · 活码','MO',vChannels],['accounts','医护账号 · 成员账号','M',vAccounts],['patient','患者档案 · 微信沟通','MOD',vPatient],['task','任务抽屉 · 微信发送','MO',vTask]];
render();
</script></body></html>
